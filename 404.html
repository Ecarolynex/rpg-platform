<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elementum</title>
  <script>
    (function () {
      var l = window.location;
      var base = "/rpg-platform/";
      var path = l.pathname.startsWith(base)
        ? l.pathname.slice(base.length)
        : l.pathname.replace(/^\/+/, "");

      var query = l.search || "";
      var hash = l.hash || "";

      var target = base + "?p=/" + path + query + hash;
      window.location.replace(target);
    })();
  </script>
</head>

</body>
</html>
